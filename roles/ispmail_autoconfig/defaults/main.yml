---
# Autoconfig della posta (formato Thunderbird, config-v1.1.xml): quando si
# aggiunge un account, il client scarica da
#   https://autoconfig.<dominio>/mail/config-v1.1.xml
# server, porte, cifratura e formato del nome utente. Senza, il client
# tira a indovinare e propone come utente la sola parte prima della "@",
# mentre Dovecot vuole l'indirizzo completo. Lo leggono Thunderbird,
# Thunderbird per Android/K-9, Evolution, KMail e altri.
#
# Per Outlook (desktop per Windows) lo stesso vhost risponde anche come
# autodiscover.<dominio>: Outlook manda in POST l'indirizzo a
#   https://autodiscover.<dominio>/autodiscover/autodiscover.xml
# e riceve IMAP 993 e SMTP 465 con l'indirizzo completo come utente. Il
# "nuovo Outlook" e Outlook mobile passano dai server Microsoft e possono
# ignorarlo.
#
# Per iPhone/iPad/Mac (Apple non ha un autoconfig della posta) la pagina
#   https://autoconfig.<dominio>/iphone
# da aprire con Safari chiede nome e indirizzo e scarica un profilo
# .mobileconfig già compilato (IMAP 993, SMTP 465, utente = indirizzo
# completo; la password la chiede l'iPhone). Non è firmato: iOS lo mostra
# come "non verificato", ma si installa lo stesso.
#
# Un vhost HTTPS autoconfig.<dominio> per ogni voce di ispmail_sni_domains,
# con il certificato del dominio già collegato dal ruolo ispmail_sni; come
# server IMAP/SMTP indica lo sni_hostname del dominio (mail.<dominio>).
#
# Prerequisito, NON gestito qui: i record DNS autoconfig.<dominio> e
# autodiscover.<dominio> (A o CNAME verso mail.<dominio>) nella zona del
# ruolo ansible-dns.
ispmail_autoconfig_enabled: true

ispmail_autoconfig_root: "/var/www/autoconfig"

# Aggiunge al profilo Apple anche rubrica e calendario (Radicale, personali
# e condivisi del dominio). Richiede che Radicale risponda su
# mail.<dominio>: vale per il dominio principale e, con il ruolo
# ispmail_webmail_sni, per gli altri.
ispmail_autoconfig_apple_dav: "{{ ispmail_carddav_enabled | default(false) }}"
