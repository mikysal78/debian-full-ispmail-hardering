---
- name: Crea la directory dell'autoconfig di ogni dominio
  ansible.builtin.file:
    path: "{{ ispmail_autoconfig_root }}/{{ item.domain }}/mail"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ ispmail_sni_domains }}"
  loop_control:
    label: "{{ item.domain }}"

- name: Genera il config-v1.1.xml di ogni dominio
  ansible.builtin.template:
    src: config-v1.1.xml.j2
    dest: "{{ ispmail_autoconfig_root }}/{{ item.domain }}/mail/config-v1.1.xml"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ ispmail_sni_domains }}"
  loop_control:
    label: "{{ item.domain }}"

- name: Configura i vhost autoconfig.<dominio> in Apache
  ansible.builtin.template:
    src: apache-autoconfig.conf.j2
    dest: /etc/apache2/sites-available/ispmail-autoconfig.conf
    owner: root
    group: root
    mode: "0644"
  register: ispmail_autoconfig_vhost

- name: Abilita il sito ispmail-autoconfig
  ansible.builtin.command: a2ensite -q ispmail-autoconfig
  args:
    creates: /etc/apache2/sites-enabled/ispmail-autoconfig.conf
  notify: reload apache

# Un errore nel vhost farebbe fallire il reload e, al primo riavvio,
# fermerebbe anche Roundcube: meglio bloccarsi qui.
- name: Verifica la configurazione di Apache
  ansible.builtin.command: apache2ctl configtest
  changed_when: false
  when: ispmail_autoconfig_vhost is changed
  notify: reload apache
