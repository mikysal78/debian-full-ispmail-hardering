---
- name: Configura unattended-upgrades (aggiornamenti di sicurezza automatici)
  ansible.builtin.template:
    src: 50unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Abilita download/aggiornamento automatico giornaliero
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Abilita e avvia il timer di unattended-upgrades
  ansible.builtin.systemd:
    name: unattended-upgrades
    enabled: true
    state: started

- name: Configura needrestart (riavvio dei servizi dopo gli aggiornamenti)
  ansible.builtin.copy:
    dest: /etc/needrestart/conf.d/50-hardening.conf
    content: |
      # Gestito da Ansible (ruolo common)
      $nrconf{restart} = '{{ needrestart_restart_mode }}';
    owner: root
    group: root
    mode: "0644"
