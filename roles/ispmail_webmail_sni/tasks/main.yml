---
- name: Configura i vhost webmail di ogni dominio SNI in Apache
  ansible.builtin.template:
    src: apache-webmail-sni.conf.j2
    dest: /etc/apache2/sites-available/ispmail-webmail-sni.conf
    owner: root
    group: root
    mode: "0644"
  register: ispmail_webmail_sni_vhost

- name: Abilita il sito ispmail-webmail-sni
  ansible.builtin.command: a2ensite -q ispmail-webmail-sni
  args:
    creates: /etc/apache2/sites-enabled/ispmail-webmail-sni.conf
  notify: reload apache

# Un errore nel vhost farebbe fallire il reload e, al primo riavvio,
# fermerebbe anche la webmail principale: meglio bloccarsi qui.
- name: Verifica la configurazione di Apache
  ansible.builtin.command: apache2ctl configtest
  changed_when: false
  when: ispmail_webmail_sni_vhost is changed
  notify: reload apache
